<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  role="img"
  aria-label="DVD disc"
>
  <defs>
    <radialGradient id="discSilver" cx="30%" cy="25%" r="70%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#bfdbfe" />
      <stop offset="1" stop-color="#93c5fd" />
    </radialGradient>
  </defs>

  <!-- Outer silver disc -->
  <circle
    cx="16"
    cy="16"
    r="13.5"
    fill="url(#discSilver)"
    stroke="#9b9bb0"
    stroke-width="1"
  />

  <!-- Inner hub -->
  <circle
    cx="16"
    cy="16"
    r="3.2"
    fill="#dbeafe"
    stroke="#9b9bb0"
    stroke-width="0.8"
  />

  <!-- Subtle highlight ring -->
  <circle
    cx="16"
    cy="16"
    r="8.5"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.55"
    stroke-width="0.9"
  />
</svg>
